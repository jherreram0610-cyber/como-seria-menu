# Entorno de PRUEBAS LOCALES (front + back + bd), todo containerizado.
# En producción esto no se usa: el front y las funciones /api se despliegan en Vercel,
# y la base de datos vive en Supabase. Esto es solo para validar antes de subir.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comoseria
    ports:
      - "5432:5432"
    volumes:
      - comoseria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: node --experimental-strip-types scripts/dev-api-server.mjs
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/comoseria
      ADMIN_PASSWORD: comoseria-test-2026
      ADMIN_SESSION_SECRET: local-dev-secret-change-me-please-1234567890
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - comoseria_node_modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx vite --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
      VITE_WATCH_POLLING: "1"
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - .:/app
      - comoseria_node_modules:/app/node_modules

volumes:
  comoseria_pgdata:
  comoseria_node_modules:
